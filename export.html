<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width,initial-scale=1.0,user-scalable=no,minimum-scale=1,maximum-scale=1">
    <title>导入、导出播放列表</title>
    <style>
        :root {
            --bg: #1e1e1e;
            --panel: #262626;
            --border: #3c3c3c;
            --muted: #9a9a9a;
            --accent: #0dba64;
            --accent-hover: #0dd26f;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: #fff;
            font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
        }

        body {
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 12px 0;
        }

        h1 .fa {
            margin-right: 8px;
        }

        textarea {
            width: 100%;
            height: 320px;
            padding: 12px;
            margin: 8px 0 16px 0;
            background: #141414;
            color: #cfcfcf;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            line-height: 1.6;
            outline: none;
            resize: vertical;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        button {
            padding: 10px 28px;
            background: var(--accent);
            color: #fff;
            border: 1px solid var(--accent);
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 120ms ease, transform 120ms ease;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active {
            transform: scale(0.97);
        }

        button:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }

        .panel {
            margin-top: 16px;
            padding: 12px 16px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .panel h2 {
            margin: 0 0 8px 0;
            font-size: 15px;
            color: var(--muted);
            font-weight: 600;
        }

        #show_aera {
            white-space: pre-wrap;
            word-break: break-all;
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            line-height: 1.7;
            color: #e6e6e6;
        }

        .hint {
            margin-top: 12px;
            font-size: 12px;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>导入、导出播放列表</h1>
        <textarea id="lrcshow" placeholder="粘贴播放列表 JSON 数据"></textarea>
        <button onclick="saveplaylist()">保存</button>
        <div class="panel">
            <h2>ID 列表：</h2>
            <div id="show_aera"></div>
        </div>
        <p class="hint">此处数据与主站播放列表（localStorage）同步，保存后回到主站即可生效。</p>
    </div>
    <script>
        var lrc = localStorage.getItem("playing-list");

        if (lrc == undefined) {
            lrc = "";
        }
        document.getElementById("lrcshow").value = lrc;
        saveplaylist = function () {
            if (confirm("确认继续？") != true) return;
            localStorage.setItem("playing-list", document.getElementById("lrcshow").value);
            alert("处理成功！")
        }
        let data = [];
        try {
            data = JSON.parse(lrc);
        } catch (e) {
            console.error(e);
            alert(e.message);
        }
        let obj = document.getElementById("show_aera");
        obj.innerHTML = "";
        let result = "";
        for (let i = 0; i < data.length; i++) {
            result = result + (result == "" ? "" : "\r\n") + data[i].id;
        }
        obj.innerText = result;
    </script>
</body>

</html>
